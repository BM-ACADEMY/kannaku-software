# Kanakku — Afra Ventures. Run: docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kanakku
      POSTGRES_USER: kanakku
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanakku"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: server/.env
    environment:
      DATABASE_URL: postgres://kanakku:${DB_PASSWORD}@db:5432/kanakku
      TZ: Asia/Kolkata
      UPLOAD_DIR: /app/uploads        # bill photos & receipts
      BACKUP_DIR: /backups            # read-only: autopilot alerts if backups stop
    volumes:
      - uploads:/app/uploads
      - ./backups:/backups:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-4000}:4000"

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      N8N_HOST: n8n.afraventures.in
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.afraventures.in/
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-true}   # false only for a local install without HTTPS
      KANAKKU_URL: http://app:4000
      KANAKKU_INTERNAL_KEY: ${INTERNAL_API_KEY}
      WA_PHONE_NUMBER_ID: ${WA_PHONE_NUMBER_ID}
      WA_TOKEN: ${WA_TOKEN}
    volumes:
      - n8ndata:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    ports:
      - "127.0.0.1:5678:5678"

  # Daily at 02:00 IST: database dump + bill photos into ./backups, kept 30 days
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      TZ: Asia/Kolkata
    volumes:
      - ./backups:/backups
      - uploads:/uploads:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        run() {
          d=$$(date +%F)
          pg_dump -h db -U kanakku kanakku | gzip > /backups/kanakku_$$d.sql.gz.tmp && mv /backups/kanakku_$$d.sql.gz.tmp /backups/kanakku_$$d.sql.gz
          tar -czf /backups/uploads_$$d.tar.gz -C /uploads . 2>/dev/null || true
          find /backups -name 'kanakku_*.sql.gz' -mtime +30 -delete
          find /backups -name 'uploads_*.tar.gz' -mtime +7 -delete
          echo "backup done $$d"
        }
        run
        while true; do
          now=$$(date +%s); next=$$(date -d "$$(date +%F) 02:00" +%s 2>/dev/null || echo $$((now + 86400)))
          [ $$next -le $$now ] && next=$$((next + 86400))
          sleep $$((next - now)); run
        done
    depends_on:
      db:
        condition: service_healthy

  # Off-site copy (Google Drive / any rclone remote). Turn on with: ./kanakku.sh offsite-setup
  offsite:
    image: rclone/rclone:1.68
    restart: unless-stopped
    profiles: ["offsite"]
    environment:
      RCLONE_REMOTE: ${RCLONE_REMOTE:-gdrive:kanakku-backups}
    volumes:
      - ./backups:/backups:ro
      - ./deploy/rclone:/config/rclone
    entrypoint: ["/bin/sh", "-c", "while true; do rclone copy /backups \"$$RCLONE_REMOTE\" --include 'kanakku_*.sql.gz' --include 'uploads_*.tar.gz' --max-age 3d && echo copied; sleep 21600; done"]

volumes:
  pgdata:
  n8ndata:
  uploads:
