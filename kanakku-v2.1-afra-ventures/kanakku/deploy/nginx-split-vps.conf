# Split deploy on the LeadOS VPS (GreatStack-style): static frontend + API on its own subdomain.
#   Frontend: kanakku.afraventures.in      → /var/www/kanakku/web/dist  (built with VITE_API_URL=https://kanakku-api.afraventures.in)
#   API:      kanakku-api.afraventures.in  → pm2 "kanakku-api" on 127.0.0.1:4100
# Save as /etc/nginx/sites-available/kanakku.conf, then:
#   ln -s /etc/nginx/sites-available/kanakku.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d kanakku.afraventures.in -d kanakku-api.afraventures.in

server {
  listen 80;
  server_name kanakku.afraventures.in;
  root /var/www/kanakku/web/dist;
  index index.html;

  # Hashed build files can be cached for a long time; index.html must not be
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}

server {
  listen 80;
  server_name kanakku-api.afraventures.in;
  client_max_body_size 5m;

  location / {
    proxy_pass http://127.0.0.1:4100;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
  }
}
