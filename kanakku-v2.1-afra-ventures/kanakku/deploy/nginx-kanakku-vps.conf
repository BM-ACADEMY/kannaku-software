# /etc/nginx/sites-available/kanakku  (LeadOS VPS — app container on 127.0.0.1:4100)
#   sudo ln -s /etc/nginx/sites-available/kanakku /etc/nginx/sites-enabled/kanakku
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d kanakku.afraventures.in
# /api/internal stays reachable because n8n (leados-n8n.abmgroups.org) calls it over HTTPS;
# it is guarded by the x-internal-key header (INTERNAL_API_KEY, 24+ chars).
server {
  listen 80;
  server_name kanakku.afraventures.in;
  client_max_body_size 5m;

  location / {
    proxy_pass http://127.0.0.1:4100;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
  }
}
