# /etc/nginx/sites-available/kanakku  → ln -s to sites-enabled, then: certbot --nginx -d kanakku.afraventures.in -d n8n.afraventures.in
server {
  server_name kanakku.afraventures.in;
  client_max_body_size 5m;
  location / {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  # n8n-only endpoints are called inside Docker; never expose them publicly
  location /api/internal/ { deny all; }
  listen 80;
}

server {
  server_name n8n.afraventures.in;
  location / {
    proxy_pass http://127.0.0.1:5678;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  listen 80;
}
