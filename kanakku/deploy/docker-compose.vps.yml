# Kanakku on a server that already runs PostgreSQL + n8n (the LeadOS VPS).
# Only the app container — it uses the existing database and n8n.
#   From the project root:  docker compose -f deploy/docker-compose.vps.yml up -d --build
#   Logs:                   docker logs -f kanakku
# server/.env must point DATABASE_URL at host.docker.internal:5432 (the host's PostgreSQL).
services:
  kanakku:
    build: ..
    container_name: kanakku
    restart: unless-stopped
    env_file: ../server/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Kolkata
      UPLOAD_DIR: /app/uploads
      BACKUP_DIR: /backups
    volumes:
      - kanakku_uploads:/app/uploads
      - ../backups:/backups:ro
    # Only nginx on this server can reach it. Change KANAKKU_PORT if 4100 is taken.
    ports:
      - "127.0.0.1:${KANAKKU_PORT:-4100}:4000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Backups were missing from this setup. Daily 02:00 IST dump of the kanakku database + bill photos, kept 30 days.
  # Needs DATABASE_URL in ../server/.env (same one the app uses, pointing at host.docker.internal).
  kanakku-backup:
    image: postgres:16-alpine
    container_name: kanakku-backup
    restart: unless-stopped
    env_file: ../server/.env
    environment:
      TZ: Asia/Kolkata
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../backups:/backups
      - kanakku_uploads:/uploads:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        run() {
          d=$$(date +%F)
          pg_dump "$$DATABASE_URL" | gzip > /backups/kanakku_$$d.sql.gz.tmp && mv /backups/kanakku_$$d.sql.gz.tmp /backups/kanakku_$$d.sql.gz
          tar -czf /backups/uploads_$$d.tar.gz -C /uploads . 2>/dev/null || true
          find /backups -name 'kanakku_*.sql.gz' -mtime +30 -delete
          find /backups -name 'uploads_*.tar.gz' -mtime +7 -delete
          echo "backup done $$d"
        }
        run
        while true; do
          now=$$(date +%s); next=$$(date -d "$$(date +%F) 02:00" +%s 2>/dev/null || echo $$((now + 86400)))
          [ $$next -le $$now ] && next=$$((next + 86400))
          sleep $$((next - now)); run
        done

  kanakku-offsite:
    image: rclone/rclone:1.68
    container_name: kanakku-offsite
    restart: unless-stopped
    profiles: ["offsite"]
    environment:
      RCLONE_REMOTE: ${RCLONE_REMOTE:-gdrive:kanakku-backups}
    volumes:
      - ../backups:/backups:ro
      - ./rclone:/config/rclone
    entrypoint: ["/bin/sh", "-c", "while true; do rclone copy /backups \"$$RCLONE_REMOTE\" --include 'kanakku_*.sql.gz' --include 'uploads_*.tar.gz' --max-age 3d && echo copied; sleep 21600; done"]

volumes:
  kanakku_uploads:
